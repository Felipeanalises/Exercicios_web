<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estados do Sudeste do Brasil</title>
    <link rel="stylesheet" href="aerquv.css">
</head>
<body>
    <div class="container">
        <!-- Esquerda: Listbox com as siglas -->
        <div class="painel-esquerdo">
            <select id="selectEstados" size="4">
                <option value="0" selected>QROO</option>
                <option value="1">CDMX</option>
                <option value="2">PUE</option>
                <option value="3">ZAC</option>
            </select>
        </div>

        <!-- Meio: Botão -->
        <div class="painel-meio">
            <button id="btnDetalhes">Detalhes</button>
        </div>

        <!-- Direita: Quatro divs/quadros de informações -->
        <div class="painel-direito">
            <div class="card-info">
                <strong>Capital</strong>
                <div id="divCapital">-</div>
            </div>
            <div class="card-info">
                <strong>Área</strong>
                <div id="divArea">-</div>
            </div>
            <div class="card-info">
                <strong>População</strong>
                <div id="divPopulacao">-</div>
            </div>
            <div class="card-info">
                <strong>Bandeira</strong>
                <div id="divBandeira">-</div>
            </div>
        </div>
    </div>
</body>
<script src="arquiv.js"></script>
</html>
